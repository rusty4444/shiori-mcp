[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shiori-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Shiori bookmark manager"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hermes Agent" }]
keywords = ["shiori", "mcp", "model-context-protocol", "bookmarks", "read-it-later"]
dependencies = ["mcp>=1.2.0", "httpx>=0.27.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "respx>=0.21.0", "ruff>=0.8.0"]

[project.scripts]
shiori-mcp = "shiori_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shiori_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
